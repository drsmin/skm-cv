# scripts/docs-budget.conf — skm-cv 프로젝트별 값. 전체 선택지는 docs-budget.conf.example 참고.
# (bash 로 source 된다)

# ── 게이트 (scripts/check.sh) — 정적 사이트라 빌드·테스트가 없다. 문서 예산 가드만 돈다.
GATE_STEPS='docs|bash scripts/check-docs-budget.sh'
# 원본 페이지(D-003)와 외부 라이브러리는 크기 검사에서 뺀다
SRC_EXCLUDE='(^|/)assets/|^cv\.html$|^portfolio\.html$|\.min\.'

# ── 커밋 전 훅(scripts/hooks/pre-commit-test.sh)이 돌릴 명령
TEST_CMD='bash scripts/check.sh'

# ── 큰 파일 Read 차단 (scripts/hooks/pre-read-size.sh) — 이미지는 막고 텍스트는 알린다
READ_IMAGE_HARD=40000
READ_TEXT_SOFT=60000
